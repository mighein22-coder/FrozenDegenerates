<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover runs the page edge to edge, under the home bar and
         (in landscape) the notch. The fixed bottom nav and the page's bottom
         padding add env(safe-area-inset-*) to stay clear of them. The status
         bar below is opaque black rather than black-translucent, so nothing
         needs a top inset, and light mode never gets white text on white. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>IcePick - NHL League</title>
    <meta name="theme-color" content="#0f172a" />
    <meta name="description" content="IcePick: the NHL Saturday pick'em pool." />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <!-- iOS ignores the manifest for most of this, so it needs its own tags. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="IcePick" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <script>
      // Apply the saved theme before first paint, so a light-mode member does
      // not see a flash of the dark palette. Mirrors resolveTheme() in
      // lib/theme.ts — keep the two in step.
      (function () {
        var pref = 'dark';
        try { pref = localStorage.getItem('icepick-theme') || 'dark'; } catch (e) {}
        var light = pref === 'light' ||
          (pref === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches);
        document.documentElement.dataset.theme = light ? 'light' : 'dark';
      })();
    </script>
    <!-- Styles (Tailwind, theme variables, fonts) are bundled from index.css, imported by index.tsx. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
