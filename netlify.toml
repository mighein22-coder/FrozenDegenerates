[build]
  command = "npm --prefix src ci && npm --prefix netlify/functions ci && npm --prefix src run build"
  publish = "src/dist"
  functions = "netlify/functions"

[dev]
  command = "npm run dev"
  targetPort = 3000
  port = 8888
  autoLaunch = false
  framework = "#custom"
  base = "src"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "20"

# Environment variables (set these in the Netlify dashboard)
#
# Client bundle — these are inlined into public JS, so they must not be secret:
#   VITE_SUPABASE_URL
#   VITE_SUPABASE_ANON_KEY
#   VITE_SYNC_WEEK_SECRET   (see docs/OPERATIONS.md — not actually secret)
#
# Functions only (never sent to the browser):
#   SUPABASE_SERVICE_ROLE_KEY
#   SYNC_WEEK_SECRET
