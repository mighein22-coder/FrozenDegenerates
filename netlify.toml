[build]
  command = "npm --prefix src ci && npm --prefix netlify/functions ci && npm --prefix src run build"
  publish = "src/dist"
  functions = "netlify/functions"

[dev]
  command = "npm run dev"
  targetPort = 3000
  port = 8888
  autoLaunch = false
  framework = "#custom"
  base = "src"

[functions]
  directory = "netlify/functions"

# Automated score sync. Runs the same scoring pass the app triggers on login,
# so standings move whether or not anyone opens the site.
#
# Cron is UTC. Every 15 minutes, on purpose: the function asks the database
# which weeks are past their Saturday 10:00 AM ET deadline and not yet
# COMPLETED, and that is empty most of the week — those runs cost one SELECT
# and stop. Real work happens Saturday morning through the 4:00 AM ET Sunday
# close, where 15 minutes is about how stale a score can get before someone
# notices. A window pinned to Saturday night would need DST padding in UTC and
# would be wrong twice a season; this has no edges.
[functions."scheduled-sync"]
  schedule = "*/15 * * * *"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "20"

# Environment variables (set these in the Netlify dashboard)
#
# Client bundle — these are inlined into public JS, so they must not be secret:
#   VITE_SUPABASE_URL
#   VITE_SUPABASE_ANON_KEY
#
# Functions only (never sent to the browser):
#   SUPABASE_SERVICE_ROLE_KEY
#
# sync-week authenticates the caller's Supabase access token, so there is no
# shared secret to configure on either side. scheduled-sync needs no credential
# at all: it imports the scoring pass instead of calling sync-week over HTTP,
# so there is no request to authenticate.
